version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - python3 -m pip install --upgrade pip setuptools wheel
    build:
      # Vendor all dependencies into the application folder so they are copied into the final runtime image
      - mkdir -p /app/python
      - python3 -m pip install --no-cache-dir --target /app/python -r requirements.txt
      # Minimal diagnostics (use vendored path)
      - python3 --version
      - which python3
      - PYTHONPATH=/app/python python3 -c "import chainlit; import os, sys; print('Chainlit:', getattr(chainlit, '__version__', 'unknown')); print('Site:', os.path.dirname(chainlit.__file__)); print('PYTHONPATH ok')"
run:
  runtime-version: 3.11.13
  command: python3 -m chainlit run app/main.py --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT
  env:
    - name: PORT
      value: "8000"
    - name: AWS_DEFAULT_REGION
      value: "us-west-2"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: CHAINLIT_APP_ROOT
      value: "/tmp"
    - name: PYTHONPATH
      value: "/app/python"