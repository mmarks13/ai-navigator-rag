version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - python3 -m pip install --upgrade pip setuptools wheel
    build:
      - python3 -m pip install --no-cache-dir -r requirements.txt
      - python3 --version
      - which python3
      - python3 -c "import chainlit; print('Chainlit installed:', chainlit.__version__)"
      - python3 -m chainlit --help
run:
  runtime-version: 3.11.13
  command: python3 -m chainlit run app/main.py --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT
  env:
    - name: PORT
      value: "8000"
    - name: AWS_DEFAULT_REGION
      value: "us-west-2"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: CHAINLIT_APP_ROOT
      value: "/tmp"